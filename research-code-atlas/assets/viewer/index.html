<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文与代码执行图谱</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><small>RESEARCH CODE ATLAS · 静态研究代码学习</small><h1 id="title">读取图谱…</h1></div><div><label>入口 <select id="entry" data-testid="entry"></select></label><div id="coverage"></div></div></header>
<div class="layout"><aside id="left"><label for="search">搜索函数、文件或作用</label><input id="search" data-testid="search" placeholder="normalize / loss / train"><div id="search-results"></div><h2>核心函数与学习路线</h2><div id="core"></div><h2>入口阶段</h2><div id="stages"></div><h2>文件与全部符号</h2><div id="files"></div></aside>
<main><nav id="main-tabs"><button data-view="overview">总览</button><button data-view="graph">调用图</button><button data-view="tree">调用层级</button><button data-view="flow">内部流程</button></nav>
<div class="panel" id="overview"></div><div class="panel" id="graph-panel" hidden><div class="tools"><label>深度 <input id="depth" type="range" min="1" max="8" value="3"><span id="depth-value">3</span></label><label>边 <select id="resolution"><option value="all">所有证据级别</option><option value="resolved_static">确定静态</option><option value="candidate">候选</option><option value="unresolved">未解析</option><option value="external">外部</option></select></label><label>关系 <select id="relation"><option value="all">全部调用</option><option value="calls">calls</option><option value="constructs">constructs</option><option value="module_call">module_call</option></select></label><button id="fit">适应画布</button></div><div id="graph"></div><p class="legend">实线：源码静态确认 · 虚线：候选 · 点线：未解析（?） · 外部：项目外<br>调用图 ≠ 模块包含树 ≠ 张量数据流 ≠ 反向图</p></div>
<div class="panel" id="tree" hidden></div><div class="panel" id="flow" hidden></div>
</main><aside id="right"><h2 id="card-title" data-testid="card-title">选择函数</h2><div id="card" data-testid="card"></div></aside></div>
<section class="bottom"><nav id="bottom-tabs"><button data-tab="code">源码</button><button data-tab="paper">论文对照</button><button data-tab="experiments">实验设置</button><button data-tab="impact">修改影响</button><button data-tab="unknown">未知清单</button><button id="back">← 返回</button></nav><div id="code" data-testid="source"></div><div id="paper" hidden></div><div id="experiments" hidden></div><div id="impact" hidden></div><div id="unknown" hidden></div></section>
<footer id="status" data-testid="status"></footer>
<script src="vendor/cytoscape.min.js"></script><script src="vendor/dagre.min.js"></script><script src="vendor/cytoscape-dagre.js"></script><script src="atlas-data.js"></script><script src="atlas-sources.js"></script><script src="app.js"></script></body></html>
